name: Google contribution intake
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: google-intake-${{ github.repository }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Authenticate to Google using repository workload identity
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Collect at most ten submissions without running candidate code
        run: node scripts/google-intake.mjs collect
        env:
          GCS_INTAKE_BUCKET: ${{ vars.GCS_INTAKE_BUCKET }}
          GCS_RECEIPTS_BUCKET: ${{ vars.GCS_RECEIPTS_BUCKET }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
